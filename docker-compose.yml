name: hevy-fatigue
services:
  hevy-fatigue:
    image: ghcr.io/bross84/hevy-fatigue:latest
    build: .
    container_name: hevy-fatigue
    restart: unless-stopped
    environment:
      - DB_PATH=/data/hevy_fatigue.db
      - RACKBOOK_DB_PATH=/training-data/rackbook.db
      - HEVY_FATIGUE_DB_PATH=/data/hevy_fatigue.db
      - HEVY_WRITES_ENABLED=${HEVY_WRITES_ENABLED:-0}
      - TZ=America/New_York
    ports:
      - mode: ingress
        target: 8000
        published: "8125"
        protocol: tcp
    volumes:
      - hevy-data:/data
      - training-data:/training-data
    networks:
      - hevy-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/sync/status')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
volumes:
  hevy-data:
    driver: local
  training-data:
    driver: local
networks:
  hevy-net:
    driver: bridge
